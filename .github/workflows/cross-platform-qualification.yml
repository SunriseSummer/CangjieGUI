name: Cross-platform qualification

on:
  workflow_dispatch:
    inputs:
      sdl_ref:
        description: CangjieSDL branch, tag, or commit paired with this GUI revision
        required: true
        default: main
        type: string
      performance_mode:
        description: Platform performance action; candidate/check require a stable AC runner
        required: true
        default: report
        type: choice
        options:
          - report
          - candidate
          - check
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/cross-platform-qualification.yml
      - .dev/**
      - examples/**
      - platform/**
      - src/**
      - cjpm.toml
      - README.md
      - docs/**

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable-${{ matrix.profile }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-x86_64
            runner: ubuntu-24.04
          - profile: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout CangjieGUI
        uses: actions/checkout@v6
        with:
          path: CangjieGUI
          persist-credentials: false

      - name: Checkout paired CangjieSDL
        uses: actions/checkout@v6
        with:
          repository: SunriseSummer/CangjieSDL
          ref: ${{ inputs.sdl_ref || 'main' }}
          path: CangjieSDL
          persist-credentials: false

      - name: Install Linux SDL build prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          cmake ninja-build pkg-config libfreetype6-dev libharfbuzz-dev

      - name: Install macOS SDL build prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja pkg-config freetype harfbuzz
          printf 'SDL_FREETYPE_PREFIX=%s\n' "$(brew --prefix freetype)" >> "$GITHUB_ENV"
          printf 'SDL_HARFBUZZ_PREFIX=%s\n' "$(brew --prefix harfbuzz)" >> "$GITHUB_ENV"

      - name: Verify portable bootstrap contracts
        working-directory: CangjieGUI
        run: python .dev/cli.py test tools

      - name: Fetch hash-pinned official toolchain sources
        id: bootstrap
        working-directory: CangjieGUI
        run: >-
          python .dev/cli.py release bootstrap
          --profile ${{ matrix.profile }}

      - name: Activate isolated Cangjie SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk='${{ steps.bootstrap.outputs.cangjie_root }}'
          runtime='${{ steps.bootstrap.outputs.cangjie_runtime }}'
          test -x "$sdk/bin/cjc"
          test -d "$runtime"
          test -d "$sdk/tools/lib"
          printf 'CANGJIE_HOME=%s\n' "$sdk" >> "$GITHUB_ENV"
          for directory in "$sdk/bin" "$sdk/tools/bin"; do
            test -d "$directory"
            printf '%s\n' "$directory" >> "$GITHUB_PATH"
          done
          runtime_paths="$runtime:$sdk/tools/lib"
          printf '%s\n' "$runtime" "$sdk/tools/lib" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s\n' "$runtime_paths" >> "$GITHUB_ENV"
          printf 'DYLD_LIBRARY_PATH=%s\n' "$runtime_paths" >> "$GITHUB_ENV"

      - name: Verify isolated Cangjie toolchain
        run: cjc --version && cjpm --version

      - name: Build pinned SDL shared runtimes
        working-directory: CangjieGUI
        shell: bash
        run: |
          set -euo pipefail
          dependencies=()
          if test "${{ runner.os }}" = "macOS"; then
            dependencies+=(--dependency-prefix "$SDL_FREETYPE_PREFIX")
            dependencies+=(--dependency-prefix "$SDL_HARFBUZZ_PREFIX")
          fi
          python .dev/cli.py release build-sdl \
            --profile '${{ matrix.profile }}' \
            --sdl-source '${{ steps.bootstrap.outputs.sdl_root }}' \
            --sdl-ttf-source '${{ steps.bootstrap.outputs.sdl_ttf_root }}' \
            --jobs 2 "${dependencies[@]}"

      - name: Stage built SDL runtimes and loader paths
        working-directory: CangjieGUI
        shell: bash
        run: |
          set -euo pipefail
          runtime="$PWD/target/dev/toolchains/${{ matrix.profile }}/sdl-prefix"
          python .dev/cli.py release stage-runtime --source "$runtime" --destination ../CangjieSDL/.sdl3
          staged="$PWD/../CangjieSDL/.sdl3"
          printf '%s\n' "$staged" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s:%s\n' "$staged" "${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          printf 'DYLD_LIBRARY_PATH=%s:%s\n' "$staged" "${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          printf 'SDL_VIDEODRIVER=dummy\n' >> "$GITHUB_ENV"

      - name: Build and test CangjieSDL headlessly
        working-directory: CangjieSDL
        run: cjpm build && cjpm test --no-progress

      - name: Build and test CangjieGUI packages headlessly
        working-directory: CangjieGUI
        run: cjpm build && python .dev/cli.py test packages

      - name: Verify documentation and public example builds
        working-directory: CangjieGUI
        run: >-
          python .dev/cli.py check docs &&
          python .dev/cli.py test examples --action build --jobs 2 --timeout 300

      - name: Upload portability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cui-${{ matrix.profile }}-portability
          if-no-files-found: error
          path: |
            CangjieGUI/target/dev/release/bootstrap-${{ matrix.profile }}.json
            CangjieGUI/target/dev/release/sdl-build-${{ matrix.profile }}.json
            CangjieGUI/target/dev/test-package-results/**

  qualify:
    name: ${{ matrix.profile }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows-x86_64
            os_label: Windows
            arch_label: X64
          - profile: linux-x86_64
            os_label: Linux
            arch_label: X64
          - profile: macos-arm64
            os_label: macOS
            arch_label: ARM64
    runs-on: [self-hosted, "${{ matrix.os_label }}", "${{ matrix.arch_label }}", cangjie-1.0.5, cui-gui]

    steps:
      - name: Checkout CangjieGUI
        uses: actions/checkout@v6
        with:
          path: CangjieGUI
          persist-credentials: false

      - name: Checkout paired CangjieSDL
        uses: actions/checkout@v6
        with:
          repository: SunriseSummer/CangjieSDL
          ref: ${{ inputs.sdl_ref || 'main' }}
          path: CangjieSDL
          persist-credentials: false

      - name: Stage explicit SDL runtimes
        working-directory: CangjieGUI
        run: python .dev/cli.py release stage-runtime

      - name: Verify tooling contracts
        working-directory: CangjieGUI
        run: python .dev/cli.py test tools

      - name: Build and test CangjieSDL
        working-directory: CangjieSDL
        run: cjpm build && cjpm test --no-progress

      - name: Build and test CangjieGUI packages
        working-directory: CangjieGUI
        run: cjpm build && python .dev/cli.py test packages

      - name: Verify documentation
        working-directory: CangjieGUI
        run: python .dev/cli.py check docs

      - name: Build all public examples
        working-directory: CangjieGUI
        run: python .dev/cli.py test examples --action build --jobs 2 --timeout 300

      - name: Verify real-window examples and retained equivalence
        working-directory: CangjieGUI
        run: python .dev/cli.py test examples --smoke-snapshots --retained-diff --timeout 300

      - name: Verify Windows UI Automation client
        if: matrix.profile == 'windows-x86_64'
        working-directory: CangjieGUI
        shell: pwsh
        run: .dev/platform/windows/check_uia.ps1

      - name: Verify clean release directory
        working-directory: CangjieGUI
        run: >-
          python .dev/cli.py release verify
          --expected-profile ${{ matrix.profile }}
          --expected-sdk 1.0.5
          --timeout 120
          --build-timeout 240

      - name: Capture target-platform performance environment
        if: inputs.performance_mode == '' || inputs.performance_mode == 'report'
        working-directory: CangjieGUI
        run: python .dev/cli.py bench run --display --samples 3 --timeout 600

      - name: Capture reviewable target-platform baseline candidate
        if: inputs.performance_mode == 'candidate'
        working-directory: CangjieGUI
        run: >-
          python .dev/cli.py bench run --display --samples 5
          --capture-baseline-candidate --timeout 600

      - name: Check target-platform performance baseline
        if: inputs.performance_mode == 'check'
        working-directory: CangjieGUI
        run: python .dev/cli.py bench run --display --samples 5 --check --timeout 600

      - name: Verify incremental architecture evidence
        working-directory: CangjieGUI
        run: python .dev/cli.py bench probe --samples 3 --timeout 600

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cui-${{ matrix.profile }}-qualification
          if-no-files-found: error
          path: |
            CangjieGUI/target/dev/release/**
            CangjieGUI/target/dev/test-package-results/**
            CangjieGUI/target/dev/examples/**
            CangjieGUI/target/bench/results/**
